name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 1 * * 1-5" # 9am SGT, weekdays only
  workflow_dispatch: # allows manual trigger from GitHub UI

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install linters
        run: pip install black ruff
      - name: Check formatting (Black)
        run: black --check backend/
      - name: Lint (Ruff)
        run: ruff check backend/

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install Node
        uses: actions/setup-node@v3
        with:
          node-version: "20"
      - name: Install dependencies
        run: cd frontend && npm install
      - name: Check formatting (Prettier)
        run: cd frontend && npm run format:check
      - name: Lint (ESLint)
        run: cd frontend && npm run lint

  test:
    name: PyTest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          cd backend
          python -m pytest test_greeks.py -v --tb=short

      - name: Run integration tests
        run: |
          cd backend
          python -m pytest test_integration.py -v --tb=short

  e2e:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests pytest
      - name: Run E2E tests against deployed backend
        run: pytest backend/test_e2e.py -v -m e2e --tb=short
